name: Gitflow Branch Source Guard

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  gitflow-branch-guard:
    name: Validate Gitflow Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Gitflow source branch rules
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Validating PR: ${HEAD_REF} -> ${BASE_REF}"
          if [ "${BASE_REF}" = "main" ]; then
            if ! echo "${HEAD_REF}" | grep -qE '^(release|hotfix)/'; then
              echo "ERROR: PRs into 'main' must originate from 'release/*' or 'hotfix/*' (got '${HEAD_REF}')."
              exit 1
            fi
          elif [ "${BASE_REF}" = "develop" ]; then
            if ! echo "${HEAD_REF}" | grep -qE '^(feature|fix|docs|chore|refactor|release|hotfix)/'; then
              echo "ERROR: PRs into 'develop' must originate from 'feature/*', 'fix/*', 'docs/*', 'chore/*', 'refactor/*', 'release/*' or 'hotfix/*' (got '${HEAD_REF}')."
              exit 1
            fi
          fi
          echo "OK: '${HEAD_REF}' is allowed to target '${BASE_REF}'."
